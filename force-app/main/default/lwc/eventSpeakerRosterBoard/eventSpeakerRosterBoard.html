<template>
    <lightning-card title="Event Speaker Cockpit" icon-name="standard:event">
        <div slot="actions">
            <template if:true={hasEvents}>
                <lightning-combobox
                    name="eventPicker"
                    label="Event"
                    variant="label-hidden"
                    value={selectedEventId}
                    options={eventOptions}
                    onchange={handleEventChange}
                ></lightning-combobox>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-p-around_small slds-text-color_error">{errorMessage}</div>
        </template>

        <template if:false={hasEvents}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No events with speaker records found.
            </div>
        </template>

        <template if:true={selectedEventSummary}>
            <div class="stats-row slds-p-horizontal_medium slds-p-bottom_small slds-grid slds-wrap slds-gutters_xx-small">
                <div class="slds-col stat-tile">
                    <div class="stat-value">{selectedEventSummary.totalSpeakers}</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="slds-col stat-tile stat-tile_success">
                    <div class="stat-value">{selectedEventSummary.confirmedCount}</div>
                    <div class="stat-label">Confirmed</div>
                </div>
                <div class="slds-col stat-tile stat-tile_warning">
                    <div class="stat-value">{selectedEventSummary.pendingCount}</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="slds-col stat-tile">
                    <div class="stat-value">{selectedEventSummary.leadCount}</div>
                    <div class="stat-label">Lead</div>
                </div>
                <div class="slds-col stat-tile">
                    <div class="stat-value">{selectedEventSummary.noResponseCount}</div>
                    <div class="stat-label">No response</div>
                </div>
                <div class="slds-col stat-tile stat-tile_error">
                    <div class="stat-value">{selectedEventSummary.declineCount}</div>
                    <div class="stat-label">Decline</div>
                </div>
                <div class="slds-col stat-tile stat-tile_error">
                    <div class="stat-value">{selectedEventSummary.cancelledCount}</div>
                    <div class="stat-label">Cancelled</div>
                </div>
            </div>
        </template>

        <template if:true={hasEvents}>
            <div class="filter-row slds-p-horizontal_medium slds-p-bottom_small">
                <div class="search-field">
                    <lightning-input
                        type="search"
                        label="Search speakers"
                        variant="label-hidden"
                        placeholder="Search by name, title, or firm..."
                        value={searchTerm}
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <div class="missing-filter">
                    <lightning-combobox
                        label="Filter"
                        variant="label-hidden"
                        options={missingFilterOptions}
                        value={missingFilter}
                        onchange={handleMissingFilterChange}
                    ></lightning-combobox>
                </div>
            </div>
        </template>

        <template if:true={hasSelection}>
            <div class="bulk-bar slds-p-horizontal_medium slds-p-vertical_x-small">
                <span class="bulk-count">{selectedCount} selected</span>
                <div class="bulk-status">
                    <lightning-combobox
                        variant="label-hidden"
                        placeholder="Move to..."
                        options={statusOptions}
                        onchange={handleBulkStatusMove}
                    ></lightning-combobox>
                </div>
                <div class="bulk-field">
                    <lightning-combobox
                        variant="label-hidden"
                        options={bulkFieldOptions}
                        value={bulkFieldApiName}
                        onchange={handleBulkFieldChange}
                    ></lightning-combobox>
                </div>
                <button class="bulk-btn" onclick={handleBulkMarkDone}>Mark done</button>
                <button class="bulk-btn" onclick={handleBulkClear}>Clear</button>
                <button class="bulk-btn bulk-btn_clear" onclick={handleClearSelection}>Clear selection</button>
            </div>
        </template>

        <div class="board">
            <template for:each={columns} for:item="col">
                <div key={col.status} class="board-column">
                    <div class="column-header">
                        <span class="column-dot" style={col.dotStyle}></span>{col.status} ({col.count})
                    </div>
                    <div class="column-body">
                    <template for:each={col.rows} for:item="row">
                        <div key={row.recordId} class="speaker-card" style={row.cardStyle}>
                            <div class="card-head">
                                <lightning-input
                                    type="checkbox"
                                    variant="label-hidden"
                                    class="card-checkbox"
                                    checked={row.isSelected}
                                    data-recordid={row.recordId}
                                    onchange={handleSelectCard}
                                ></lightning-input>
                                <div class="avatar">{row.initials}</div>
                                <div class="card-info">
                                    <div class="card-name">
                                        <a href="javascript:void(0);" data-contactid={row.speakerId} onclick={navigateToContact}>{row.speakerName}</a>
                                    </div>
                                    <div class="card-sub">{row.jobTitle}</div>
                                    <div class="card-sub">{row.accountName}</div>
                                </div>
                                <button
                                    class="open-record-btn"
                                    title="Open speaker record"
                                    aria-label="Open speaker record"
                                    data-recordid={row.recordId}
                                    onclick={navigateToRecord}
                                >
                                    <lightning-icon icon-name="utility:new_window" size="xx-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="card-meta slds-text-body_small slds-text-color_weak">{row.speakerType} &middot; {row.session}</div>

                            <div class="chip-row">
                                <template for:each={row.chips} for:item="chip">
                                    <span
                                        key={chip.key}
                                        class={chip.chipClass}
                                        data-recordid={chip.recordId}
                                        data-apiname={chip.apiName}
                                        data-value={chip.value}
                                        onclick={handleChipClick}
                                    >
                                        <template if:true={chip.iconName}>
                                            <lightning-icon icon-name={chip.iconName} size="xx-small" class="chip-icon"></lightning-icon>
                                        </template>
                                        {chip.label}
                                    </span>
                                </template>
                            </div>

                            <lightning-combobox
                                name="statusMove"
                                label="Move to"
                                variant="label-hidden"
                                value={row.status}
                                options={row.statusOptions}
                                data-id={row.recordId}
                                onchange={handleStatusMove}
                            ></lightning-combobox>
                        </div>
                    </template>
                    <template if:true={col.hasMore}>
                        <button class="show-more-btn" data-status={col.status} onclick={handleShowMore}>
                            Show {col.remaining} more
                        </button>
                    </template>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
