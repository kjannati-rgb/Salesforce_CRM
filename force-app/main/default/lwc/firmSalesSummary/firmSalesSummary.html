<template>
    <div class="card">
        <!-- header -->
        <div class="card-hd">
            <div class="tile" aria-hidden="true">
                <lightning-icon icon-name="standard:report" size="small" variant="inverse"></lightning-icon>
            </div>
            <div class="hd-main">
                <div class="hd-title">
                    <h1>Firm Sales Summary</h1>
                </div>
                <div class="hd-sub"><b>{firmName}</b> · reported in <b>USD</b> · FX basis {fxBasis}</div>
            </div>
            <div class="hd-actions">
                <div class="stamp">Last refreshed<br>
                    <template if:true={lastRefreshed}>
                        <b><lightning-formatted-date-time value={lastRefreshed} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></b>
                    </template>
                    <template if:false={lastRefreshed}><b>never</b></template>
                </div>
                <button class={refreshClass} title="Recompute this firm now" onclick={handleRefresh} disabled={refreshing}>
                    <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                    Refresh now
                </button>
            </div>
        </div>

        <template if:true={error}>
            <div class="err">{error}</div>
        </template>

        <!-- toolbar -->
        <div class="toolbar">
            <div class="toolset">
                <span class="tlabel">Period</span>
                <div class="group" role="group" aria-label="Period">
                    <template for:each={periodButtons} for:item="b">
                        <button key={b.key} class={b.cls} data-key={b.key} aria-pressed={b.pressed} onclick={handlePeriod}>{b.label}</button>
                    </template>
                </div>
            </div>
            <div class="toolset">
                <span class="tlabel">Business</span>
                <div class="group" role="group" aria-label="Business type">
                    <template for:each={businessButtons} for:item="b">
                        <button key={b.key} class={b.cls} data-key={b.key} aria-pressed={b.pressed} onclick={handleBusiness}>{b.label}</button>
                    </template>
                </div>
            </div>
        </div>

        <!-- kpis -->
        <div class="kpis">
            <template for:each={kpis} for:item="k">
                <div key={k.key} class="kpi">
                    <div class="k-label">{k.label}</div>
                    <div class={k.valClass}>{k.value}</div>
                    <div class="k-sub">{k.sub}</div>
                </div>
            </template>
        </div>

        <!-- yoy -->
        <template if:true={yoy}>
            <div class="yoy">
                <h3>This FY vs Last FY</h3>
                <div class="bars">
                    <div class="ybar">
                        <div class="bl"><span>This FY</span><b>{yoy.cfyLabel}</b></div>
                        <div class="track"><i style={yoy.cfyBarStyle}></i></div>
                    </div>
                    <div class="ybar">
                        <div class="bl"><span>Last FY</span><b>{yoy.pfyLabel}</b></div>
                        <div class="track prev"><i style={yoy.pfyBarStyle}></i></div>
                    </div>
                </div>
                <div class={yoy.deltaClass}><span class="cap">YoY</span>{yoy.deltaLabel}</div>
            </div>
        </template>

        <!-- active cross-filters -->
        <template if:true={hasFilters}>
            <div class="filterbar">
                <span class="fb-label">Filtered by</span>
                <template if:true={selGroup}><span class="chip-f">Group: {selGroup}</span></template>
                <template if:true={selOfficeName}><span class="chip-f">Office: {selOfficeName}</span></template>
                <button class="x" onclick={clearFilters}>Clear all ✕</button>
            </div>
        </template>

        <!-- breakdowns (linked: click a row to cross-filter every other widget) -->
        <div class="panels">
            <div class="panel">
                <div class="panel-hd"><h2>By commercial group</h2><span class="hint">click to filter</span></div>
                <table>
                    <thead><tr><th>Group</th><th class="num">Value (USD)</th><th class="num">Items</th></tr></thead>
                    <tbody>
                        <template for:each={groupRows} for:item="r">
                            <tr key={r.key} class="row" tabindex="0" role="button" aria-selected={r.selected}
                                data-name={r.name} onclick={handleGroupSelect} onkeydown={handleRowKey}>
                                <td>
                                    <div class="grp-cell"><span class="grp-name">{r.name}</span>
                                        <div class="minibar"><i style={r.barStyle}></i></div>
                                    </div>
                                </td>
                                <td class="num">{r.value}</td>
                                <td class="num">{r.items} <span class="caret">›</span></td>
                            </tr>
                        </template>
                        <template if:false={groupRows.length}>
                            <tr><td colspan="3" class="empty">No group rollups for this selection.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div class="panel">
                <div class="panel-hd"><h2>By office</h2><span class="hint">click to filter</span></div>
                <table>
                    <thead><tr><th>Office</th><th>Location</th><th class="num">Value (USD)</th><th class="num">Won</th><th class="num">Subs</th></tr></thead>
                    <tbody>
                        <template for:each={officeRows} for:item="r">
                            <tr key={r.key} class="row" tabindex="0" role="button" aria-selected={r.selected}
                                data-id={r.id} data-name={r.name} onclick={handleOfficeSelect} onkeydown={handleRowKey}>
                                <td><span class="grp-name">{r.name}</span></td>
                                <td><span class="sub">{r.location}</span></td>
                                <td class="num">{r.value}</td>
                                <td class="num">{r.won}</td>
                                <td class="num">{r.subs} <span class="caret">›</span></td>
                            </tr>
                        </template>
                        <template if:false={officeRows.length}>
                            <tr><td colspan="5" class="empty">No offices with activity for this selection.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- drill -->
        <template if:true={drill}>
            <div class="drill">
                <div class="drill-hd">
                    <h2>Opportunities <span class="ctx">{drillCtx}</span></h2>
                    <button class="x" onclick={closeDrill}>Close</button>
                </div>
                <table>
                    <thead><tr><th>Opportunity</th><th>Office</th><th>Close date</th><th>Type</th><th>Stage</th><th class="num">Amount (USD)</th></tr></thead>
                    <tbody>
                        <template for:each={drill.rows} for:item="o">
                            <tr key={o.id}>
                                <td>{o.name}</td>
                                <td>{o.officeName}</td>
                                <td>{o.closeDate}</td>
                                <td><span class="tpill">{o.type}</span></td>
                                <td><span class={o.badgeClass}>{o.stage}</span></td>
                                <td class={o.amtClass}>{o.amount}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="pager">
                    <span class="info">{drillInfo}</span>
                    <span class="pg">
                        <button onclick={handlePrev} disabled={prevDisabled}>‹ Prev</button>
                        <button onclick={handleNext} disabled={nextDisabled}>Next ›</button>
                    </span>
                </div>
            </div>
        </template>

        <!-- footer -->
        <div class="foot">
            <span class="dot"></span>
            <span>Headline &amp; groups read from persisted USD rollups; office &amp; opportunity drill-downs computed live.</span>
            <span>·</span><span>Won value is <b>net of cancellations</b></span>
        </div>
    </div>
</template>
