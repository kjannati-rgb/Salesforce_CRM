                    title={r.label}
                >
                    <span class="lex-pin__dot"></span>
                    <span class="lex-pin__label">{r.label}</span>
                </button>
            </template>
        </div>

        <template if:true={gapNote}>
            <p class="lex-gapnote">{gapNote}</p>
        </template>

        <div class="lex-group" role="group" aria-label="Other jurisdiction">
            <p class="lex-group__label">Other</p>
            <div class="lex-chips">
                <button type="button" class={otherClass} aria-pressed={otherPressed}
                        disabled={pickerDisabled} onclick={toggleOther}>Other region</button>
            </div>
            <template if:true={showOther}>
                <textarea class="lex-other" placeholder="Which region? (optional)" value={otherText}
                          disabled={pickerDisabled} onchange={handleOther}
                          aria-label="Other region detail"></textarea>
            </template>
        </div>

        <div class="lex-seggroup" role="radiogroup" aria-label="Jurisdiction coverage answer">
            <button type="button" class={yesClass} role="radio" aria-checked={yesPressed} data-val="Yes" onclick={pick}>Yes</button>
            <button type="button" class={noClass} role="radio" aria-checked={noPressed} data-val="No" onclick={pick}>No</button>
        </div>
    </section>
</template>
