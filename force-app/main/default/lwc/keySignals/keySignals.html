<template>
    <lightning-card icon-name="utility:high_velocity_sales">
        <span slot="title">Key Signals</span>
        <lightning-button slot="actions" label="New" icon-name="utility:add" onclick={handleNew} disabled={showForm}></lightning-button>
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <template lwc:if={showForm}>
                <div class="sigform">
                    <p class="formtitle">{formTitle}</p>
                    <lightning-record-edit-form
                        object-api-name="Plan_Signal__c"
                        record-id={editId}
                        onsubmit={handleSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                    >
                        <lightning-input-field field-name="Summary__c"></lightning-input-field>
                        <lightning-input-field field-name="Signal_Type__c"></lightning-input-field>
                        <lightning-input-field field-name="Severity__c"></lightning-input-field>
                        <lightning-input-field field-name="Source__c"></lightning-input-field>
                        <lightning-input-field field-name="Recommended_Action__c"></lightning-input-field>
                        <lightning-input-field field-name="Detected_Date__c"></lightning-input-field>
                        <div class="formbtns">
                            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                            <lightning-button class="slds-p-left_x-small" variant="brand" type="submit" label="Save" disabled={saving}></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </template>

            <template lwc:if={hasData}>
                <template for:each={items} for:item="s">
                    <div key={s.id} class="signal">
                        <span class={s.dotClass}></span>
                        <div class="content">
                            <div class="summary">{s.summary}</div>
                            <div class="meta">{s.meta}</div>
                            <template lwc:if={s.recommendedAction}>
                                <div class="action">▸ {s.recommendedAction}</div>
                            </template>
                        </div>
                        <div class="sigbtns">
                            <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" title="Edit" variant="bare" data-id={s.id} onclick={handleEdit}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:check" alternative-text="Mark actioned" title="Mark actioned" variant="bare" data-id={s.id} onclick={handleActioned}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:close" alternative-text="Dismiss" title="Dismiss" variant="bare" data-id={s.id} onclick={handleDismiss}></lightning-button-icon>
                        </div>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-p-around_medium slds-text-color_weak">No open signals — click New to log one.</p>
            </template>
        </div>
    </lightning-card>
</template>
