<template>
    <lightning-card icon-name="standard:groups">
        <span slot="title">Plan Team</span>
        <lightning-button slot="actions" label="New" icon-name="utility:add" onclick={handleNew} disabled={showForm}></lightning-button>
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <template lwc:if={showForm}>
                <div class="tmform">
                    <p class="formtitle">{formTitle}</p>
                    <lightning-record-edit-form
                        object-api-name="Plan_Team_Member__c"
                        record-id={editId}
                        onsubmit={handleSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                    >
                        <lightning-input-field field-name="User__c"></lightning-input-field>
                        <lightning-input-field field-name="Plan_Role__c"></lightning-input-field>
                        <lightning-input-field field-name="Product_Family__c"></lightning-input-field>
                        <div class="formbtns">
                            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                            <lightning-button class="slds-p-left_x-small" variant="brand" type="submit" label="Save" disabled={saving}></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </template>

            <template lwc:if={hasData}>
                <template for:each={members} for:item="m">
                    <div key={m.id} class="member">
                        <div class="who">
                            <span class="name">{m.name}</span>
                            <template lwc:if={m.lane}>
                                <span class="lanetext">{m.lane}</span>
                            </template>
                        </div>
                        <div class="right">
                            <span class={m.roleClass}>{m.roleLabel}</span>
                            <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" title="Edit" variant="bare" data-id={m.id} onclick={handleEdit}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:close" alternative-text="Remove" title="Remove" variant="bare" data-id={m.id} onclick={handleDelete}></lightning-button-icon>
                        </div>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-p-around_medium slds-text-color_weak">No team members yet — click New to add one.</p>
            </template>
        </div>
    </lightning-card>
</template>
